name: APK
on: [push, workflow_dispatch]
jobs:
  build:
    # Image figée : le SDK Android y est déjà installé
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: SDK Android (plateforme 34)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.9' }
      - run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: regie-apk
          path: app/build/outputs/apk/release/*.apk
